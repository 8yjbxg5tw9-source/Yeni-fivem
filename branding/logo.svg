<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Velmora Respublikası — dövlət möhürü (196RP) -->
  <!-- Fon -->
  <rect width="600" height="600" rx="60" fill="#14161a"/>

  <!-- Bayraq zolaqları (arxa) -->
  <rect x="80" y="80" width="440" height="440" rx="220" fill="#0E4B6E"/>
  <rect x="80" y="80" width="440" height="440" rx="220" fill="none" stroke="#D9A441" stroke-width="6"/>

  <!-- Daxili qalxan -->
  <circle cx="300" cy="300" r="190" fill="#1e2228" stroke="#D9A441" stroke-width="4"/>

  <!-- Mərkəzi beşguşəli ulduz (Asterra) -->
  <polygon
    points="300,210 322,278 394,278 336,320 358,388 300,346 242,388 264,320 206,278 278,278"
    fill="#D9A441"/>

  <!-- Dörd emblem (saat əqrəbi üzrə): Mayak, Buğda, Dişli, Külüng -->
  <!-- Mayak (yuxarı-sol) -->
  <g transform="translate(220,235)" fill="#5AB0E0">
    <rect x="-8" y="-20" width="16" height="40" rx="3"/>
    <rect x="-14" y="12" width="28" height="6" rx="2"/>
  </g>
  <!-- Buğda sünbülü (yuxarı-sağ) -->
  <g transform="translate(380,235)" fill="#D9A441">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#D9A441" stroke-width="4"/>
    <ellipse cx="0" cy="-10" rx="10" ry="4" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="10" ry="4" transform="rotate(30)"/>
    <ellipse cx="0" cy="10" rx="10" ry="4" transform="rotate(-30)"/>
  </g>
  <!-- Dişli çarx (aşağı-sol) -->
  <g transform="translate(220,375)" fill="#9aa3ad">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#9aa3ad" stroke-width="6"/>
    <circle cx="0" cy="0" r="6" fill="#9aa3ad"/>
  </g>
  <!-- Külüng və çəkic (aşağı-sağ) -->
  <g transform="translate(380,375)" stroke="#6BB58A" stroke-width="6" stroke-linecap="round">
    <line x1="-18" y1="18" x2="18" y2="-18"/>
    <path d="M12,-24 L22,-22 L14,-12 Z" fill="none"/>
    <line x1="-18" y1="-6" x2="18" y2="-6"/>
  </g>

  <!-- Yazılar -->
  <text x="300" y="545" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#D9A441" letter-spacing="4">196RP</text>
  <text x="300" y="582" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#eef1f5" letter-spacing="2">VELMORA RESPUBLİKASI</text>
</svg>
