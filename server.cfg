############################################################
# 196RP — VELMORA RESPUBLİKASI — server.cfg
# Framework: Qbox + ox_lib + ox_inventory + ox_target + oxmysql
############################################################

# ===== ƏSAS =====
sv_hostname "196RP — Velmora Respublikası | Serious RP"
sv_projectName "196RP"
sv_projectDesc "Velmora Respublikası — Serious/Hardcore immersive RolePlay"
sets locale "az"                         # 100% Azərbaycan dili
sets discord ""
sets tags "roleplay, serious, whitelist, qbox, velmora, 196rp"

# ===== AÇARLAR (QEYD: real dəyərlər ayrıca, gizli saxlanılır) =====
sv_licenseKey "CHANGEME_license"
set steam_webApiKey "CHANGEME_steam"
set discord_webhook ""                    # audit log webhook-u (gizli)

# ===== VERİLƏNLƏR BAZASI =====
set mysql_connection_string "mysql://user:password@localhost/196rp?charset=utf8mb4"

# ===== ONE SYNC =====
onesync on
onesync_population false

# ===== PERFORMANS =====
set sv_enforceGameBuild 0
sv_maxclients 128                          # stress-testdən sonra 256

# ===== SƏS (pma-voice Mumble) =====
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# ===== TXADMIN =====
# txAdmin ayrıca konfiqurasiya olunur; 2FA məcburi.

# ===== YÜKLƏMƏ QAYDASI (asılılıq ağacına uyğun) =====
ensure oxmysql
ensure qbx_core
ensure ox_lib
ensure ox_inventory
ensure ox_target

# 196RP — core
ensure vr_core
ensure vr_lore

# 196RP — identiklik və admin
ensure vr_identity
ensure vr_whitelist
ensure vr_admin

# 196RP — iqtisadiyyat
ensure vr_banking
ensure vr_economy
ensure vr_licenses
ensure vr_companies
ensure vr_property
ensure vr_vehicles
ensure vr_jobs
ensure vr_insurance

# 196RP — nəqliyyat və dünya
ensure vr_garages

# 196RP — telefon və UI
ensure vr_phone
ensure vr_status
ensure vr_emotes
ensure vr_ui
ensure vr_items

# 196RP — səs (pma-voice)
ensure vr_voice

# 196RP — dövlət işləri (Addım 7: asılılıqlar tamamlandı)
ensure vr_police
ensure vr_ems
ensure vr_fire
ensure vr_court
ensure vr_government

# 196RP — kriminal (Addım 8)
