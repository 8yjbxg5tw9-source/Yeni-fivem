############################################################
# 196RP - Velmora Republic - server.cfg
# Framework: Qbox + ox_lib + ox_inventory + ox_target + oxmysql
# NOTE: all comments are in ASCII to avoid encoding issues on Windows
############################################################

# ===== BASIC =====
sv_hostname "196RP - Velmora Respublikasi | Serious RP"
set sv_projectName "196RP"
set sv_projectDesc "Velmora Republic - Serious/Hardcore immersive RolePlay"
sets locale "az"
sets tags "roleplay, serious, whitelist, qbox, velmora, 196rp"

# ===== KEYS (change CHANGEME values) =====
sv_licenseKey "CHANGEME_license"
set steam_webApiKey "CHANGEME_steam"
set discord_webhook "CHANGEME_webhook"

# ===== DATABASE =====
set mysql_connection_string "mysql://root:@localhost/196rp?charset=utf8mb4"

# ===== ONE SYNC =====
onesync on
onesync_population false

# ===== PERFORMANCE =====
sv_maxclients 128

# ===== VOICE (pma-voice Mumble) =====
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# ===== LOAD ORDER =====
ensure oxmysql
ensure qbx_core
ensure ox_lib
ensure ox_inventory
ensure ox_target

# 196RP - core
ensure vr_core
ensure vr_lore

# 196RP - identity and admin
ensure vr_identity
ensure vr_whitelist
ensure vr_admin

# 196RP - economy
ensure vr_banking
ensure vr_economy
ensure vr_licenses
ensure vr_companies
ensure vr_property
ensure vr_vehicles
ensure vr_jobs
ensure vr_insurance

# 196RP - production and nature
ensure vr_crafting
ensure vr_environment

# 196RP - media and politics
ensure vr_media
ensure vr_politics

# 196RP - pets, mail, academy, referral
ensure vr_pets
ensure vr_mail
ensure vr_academy
ensure vr_referral

# 196RP - phone and UI
ensure vr_phone
ensure vr_status
ensure vr_emotes
ensure vr_ui
ensure vr_items

# 196RP - voice
ensure vr_voice

# 196RP - government jobs
ensure vr_police
ensure vr_ems
ensure vr_fire
ensure vr_court
ensure vr_government

# 196RP - criminal
ensure vr_criminal
ensure vr_drugs
ensure vr_prison

sv_scriptHookAllowed 0
